<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minted</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                minted<span>.</span>
            </div>

            <nav>
                <button class="nav-item active">
                    Dashboard
                </button>

                <button class="nav-item">
                    Transactions
                </button>

                <button class="nav-item">
                    Budgets
                </button>

                <button class="nav-item">
                    Goals
                </button>
            </nav>

        </aside>


        <main class="main">

            <header class="topbar">
                <div>
                    <p class="eyebrow">PERSONAL FINANCE</p>
                    <h1>Dashboard</h1>
                </div>

                <button
                    class="add-button"
                    onclick="openTransactionModal()"
                >
                    + Add transaction
                </button>
            </header>


            <section class="stats">

                <div class="card">
                    <p>Current balance</p>
                    <h2 id="balance">RM 0.00</h2>
                </div>

                <div class="card">
                    <p>Income</p>
                    <h2 id="income">RM 0.00</h2>
                </div>

                <div class="card">
                    <p>Expenses</p>
                    <h2 id="expenses">RM 0.00</h2>
                </div>

                <div class="card">
                    <p>Savings rate</p>
                    <h2 id="savings-rate">0%</h2>
                </div>

            </section>


            <section class="content-grid">

                <div class="panel">

                    <div class="panel-header">
                        <h3>Recent transactions</h3>

                        <button
                            onclick="loadTransactions()"
                            class="refresh"
                        >
                            Refresh
                        </button>
                    </div>

                    <div id="transactions">
                        Loading...
                    </div>

                </div>


                <div class="panel">

                    <div class="panel-header">
                        <h3>Spending</h3>
                    </div>

                    <div id="spending">
                        No data yet.
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- TRANSACTION MODAL -->

    <div
        id="transaction-modal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">
                <h2>Add transaction</h2>

                <button
                    onclick="closeTransactionModal()"
                    class="close"
                >
                    ×
                </button>
            </div>


            <form id="transaction-form">

                <label>
                    Type

                    <select id="type">
                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>
                    </select>
                </label>


                <label>
                    Amount

                    <input
                        id="amount"
                        type="number"
                        step="0.01"
                        min="0.01"
                        placeholder="0.00"
                        required
                    >
                </label>


                <label>
                    Category

                    <input
                        id="category"
                        type="text"
                        placeholder="Food"
                        required
                    >
                </label>


                <label>
                    Description

                    <input
                        id="description"
                        type="text"
                        placeholder="Lunch"
                        required
                    >
                </label>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Add transaction
                </button>

            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
